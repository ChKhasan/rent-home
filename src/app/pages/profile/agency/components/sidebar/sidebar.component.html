<aside class="agency-sidebar">
  <div class="sidebar-header">
    <div>
      <h2>Agentlik kabineti</h2>
      <p>E'lonlar va xodimlarni boshqarish</p>
    </div>
    <a routerLink="/profile/agency/info" class="settings-link" aria-label="Agentlik ma'lumotlarini ochish">
      <i class="pi pi-cog" aria-hidden="true"></i>
    </a>
  </div>
  <nav aria-label="Agentlik kabineti bo'limlari">
    <a
      *ngFor="let link of links"
      [routerLink]="link.routerLink"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: link.routerLink === '/profile/agency' }"
      class="sidebar-link"
    >
      <span>{{ link.label }}</span>
    </a>
  </nav>
</aside>
