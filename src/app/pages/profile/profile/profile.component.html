<div class="profile profile-page py-8 md:py-[18px] md:pb-0">
  <img class="absolute top-0 z-[-1] hidden md:block" src="../../../../assets/images/image.png" alt="">
  <div class="max-w-[1180px] mx-auto px-4 flex flex-col gap-4">
    <div class="profile-toolbar flex justify-between items-center md:flex-col">
      <h1 class="text-[40px] font-medium text-[--green] md:text-[24px] md:mb-3">Shaxsiy kabinet</h1>
      <div class="profile-actions flex gap-3">
        <button [routerLink]="'/profile/chat'" pButton type="button" icon="pi pi-comments" aria-label="Yozishmalarim"
          class="btn profile-action-btn profile-action-btn--secondary md:px-4 flex md:gap-0 gap-2 items-center" iconPos="left">

          <span class="md:hidden">Yozishmalarim</span>
        </button>
        <button [routerLink]="'/profile/create'" pButton type="button" icon="pi pi-plus" aria-label="E'lon joylash"
          class="btn profile-action-btn profile-action-btn--primary md:px-4 flex md:gap-0 gap-2 items-center" iconPos="left">
          <span class="md:hidden">E'lon joylash · Uy egasi sifatida</span>
        </button>
        <button *ngIf="hasBrokerProfile" [routerLink]="'/profile/broker'" pButton type="button" icon="pi pi-id-card" aria-label="Makler kabineti"
          class="btn profile-action-btn profile-action-btn--secondary md:px-4 flex md:gap-0 gap-2 items-center" iconPos="left">
          <span class="md:hidden">Makler kabineti</span>
        </button>
        <button *ngIf="hasAgencyAccess" [routerLink]="'/profile/agency'" pButton type="button" icon="pi pi-briefcase" aria-label="Agentlik kabineti"
          class="btn profile-action-btn profile-action-btn--secondary agency-action md:px-4 flex md:gap-0 gap-2 items-center" iconPos="left">
          <span class="md:hidden">Agentlik kabineti</span>
        </button>
        <button type="button" aria-label="Kabinetdan chiqish" (click)="logoutDialog = true"
          class="logout-btn border-solid border-[2px] border-[--error-400] rounded-xl md:px-4 text-[14px] flex items-center gap-2 bg-transparent font-semibold p-3 md:py-2 md:text-xs md:border-[1px] text-[--error-400]">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M6.25033 3.33332C6.71056 3.33332 7.08366 2.96023 7.08366 2.49999C7.08366 2.03975 6.71056 1.66666 6.25033 1.66666H5.00033C3.15938 1.66666 1.66699 3.15904 1.66699 4.99999V15C1.66699 16.8409 3.15938 18.3333 5.00033 18.3333H6.25033C6.71056 18.3333 7.08366 17.9602 7.08366 17.5C7.08366 17.0398 6.71056 16.6667 6.25033 16.6667H5.00033C4.07985 16.6667 3.33366 15.9205 3.33366 15L3.33366 4.99999C3.33366 4.07952 4.07985 3.33332 5.00033 3.33332H6.25033Z"
              fill="#D42620" />
            <path
              d="M18.9229 10.5892C19.2484 10.2638 19.2484 9.73617 18.9229 9.41073L15.5896 6.0774C15.2641 5.75196 14.7365 5.75196 14.4111 6.0774C14.0856 6.40284 14.0856 6.93048 14.4111 7.25591L16.3218 9.16666L6.66699 9.16666C6.20675 9.16666 5.83366 9.53975 5.83366 9.99999C5.83366 10.4602 6.20675 10.8333 6.66699 10.8333L16.3218 10.8333L14.4111 12.7441C14.0856 13.0695 14.0856 13.5971 14.4111 13.9226C14.7365 14.248 15.2641 14.248 15.5896 13.9226L18.9229 10.5892Z"
              fill="#D42620" />
          </svg>
          <span class="md:hidden">Chiqish</span>

        </button>
        <p-dialog [modal]="true" [showHeader]="false" [(visible)]="logoutDialog">
          <div>
            <span class="p-text-secondary block my-8">Shaxsiy kabinetdan chiqmoqchimisiz ?</span>
            <div class="flex justify-end gap-2">
              <p-button label="Yo'q" (click)="logoutDialog = false" />
              <p-button label="Ha" severity="danger" (click)="logout()" />
            </div>
          </div>
        </p-dialog>
      </div>
    </div>
    <div class="profile-summary-card">
      <!-- <div class="image">
        <img *ngIf="authService.user?.images && authService.user?.images[0].image" class="w-[120px] h-[120px] rounded-full object-cover" [src]="authService.user?.images[0].image" alt="" />
      </div> -->
      <div class="image-block profile-avatar-block md:flex md:justify-center md:flex-col md:items-center">
        <div class="profile-avatar relative md:mt-[0] w-[120px] h-[120px] md:w-[64px] md:h-[64px] flex items-center">
          <div class="image w-full h-full rounded-full overflow-hidden">
            <img *ngIf="avatar; else defaultImage" class="w-full h-full object-cover" [src]="avatar" alt="" />
            <ng-template #defaultImage>
              <img class="w-full h-full object-cover" src="assets/images/avatar.png" alt="" />
            </ng-template>
          </div>
        <p-fileUpload *ngIf="isEdit" class="profile-upload desktop-upload flex md:hidden items-center absolute right-[-18px] bottom-[6px]"
            styleClass="file-upload" mode="basic" name="image" [url]="imageUploadUrl"
            [chooseButtonProps]="{ ariaLabel: 'Profil rasmini yuklash' }"
            (onUpload)="onUpload($event)" [auto]="true" method="post" [multiple]="true" accept="image/*"
            [maxFileSize]="1000000" [headers]="headers"></p-fileUpload>
        </div>
      </div>
      <div
        class="profile-summary-body body flex flex-col justify-center items-start md:flex-row md:justify-between md:items-center md:w-full">
        <div class="profile-identity flex flex-col justify-center items-start">
          <h5 class="text-[32px] font-medium md:text-base break-keep">{{ displayName }}</h5>
          <div class="profile-meta">
            <span *ngIf="profileUser.phone_number"><i class="pi pi-phone"></i>{{ profileUser.phone_number }}</span>
            <span *ngIf="profileUser.email"><i class="pi pi-envelope"></i>{{ profileUser.email }}</span>
          </div>
        </div>
        <p-fileUpload *ngIf="isEdit" class="profile-upload mobile-upload md:flex hidden items-center" styleClass="file-upload" mode="basic"
          [chooseButtonProps]="{ ariaLabel: 'Profil rasmini yuklash' }"
          name="image" [url]="imageUploadUrl" (onUpload)="onUpload($event)" [auto]="true"
          method="post" [multiple]="true" accept="image/*" [maxFileSize]="1000000" [headers]="headers"></p-fileUpload>
        <button *ngIf="!isEdit" type="button" aria-label="Profilni tahrirlash" (click)="startEdit()"
          class="profile-edit-btn mt-3 md:mt-0 border-solid border-[2px] border-[--grey-300] rounded-xl text-[14px] flex items-center gap-2 bg-transparent font-semibold p-3">
          <i class="pi pi-pencil"></i>
          <span class="md:hidden">Tahrirlash</span>
        </button>
      </div>
    </div>
    <div class="title flex justify-between items-center md:flex-col mt-4" *ngIf="!isEdit">
      <h3 class="text-[40px] font-medium text-[--green] md:text-[24px] md:mb-3" *ngIf="tab === 'likes'">Saqlangan
        E`lonlar</h3>
      <h3 class="text-[40px] font-medium text-[--green] md:text-[24px] md:mb-3" *ngIf="tab === 'announcements'">Mening
        E`lonlarim</h3>
      <p-selectButton styleClass="!rounded-2xl !w-full" [options]="stateOptions" [(ngModel)]="tab" optionValue="value">
        <ng-template let-item pTemplate>
          <div class="flex gap-2 items-center">
            <i [class]="item.icon"></i>
            <p class="hidden md:block">{{ mLabels[item.value] }}</p>
            <p class="md:hidden">{{ labels[item.value] }}</p>
          </div>
        </ng-template>
      </p-selectButton>
    </div>
    <div *ngIf="!isEdit">
      <app-likes *ngIf="tab === 'likes'"></app-likes>
      <app-announcements *ngIf="tab === 'announcements'" [embedded]="true"></app-announcements>
    </div>
    <div *ngIf="isEdit" class="profile-edit-panel body mt-4 md:mt-0 flex flex-col gap-6">
      <div class="profile-edit-header">
        <div>
          <p class="profile-eyebrow">Sozlamalar</p>
          <h4 class="text-2xl md:text-lg">Profil ma'lumotlari</h4>
        </div>
      </div>

      <div [formGroup]="ruleForm" class="profile-form">
        <div class="profile-form-section">
          <div class="profile-section-title">
            <i class="pi pi-user"></i>
            <h5>Shaxsiy ma'lumotlar</h5>
          </div>
          <div class="profile-form-grid">
            <div class="profile-field">
              <label class="font-medium text-black text-[14px]" for="name">Ism</label>
              <div class="relative w-full flex items-center password-input profile-input">
                <input pInputText [ngClass]="{
                    'ng-invalid ng-dirty': ruleForm.controls.name.touched && ruleForm.controls.name.errors && ruleForm.controls.name.errors['required'],
                  }" type="text" id="name" placeholder="Ism..." formControlName="name" />
              </div>

              <div
                *ngIf="ruleForm.controls.name.invalid && (ruleForm.controls.name.dirty || ruleForm.controls.name.touched)">
                <app-invaid-text [text]="'Ism kiritilishi shart.'"
                  *ngIf="ruleForm.controls.name.errors && ruleForm.controls.name.errors['required']"></app-invaid-text>
                <app-invaid-text [text]="'Ism kamida 4 ta belgidan iborat bo‘lishi kerak.'"
                  *ngIf="ruleForm.controls.name.errors && ruleForm.controls.name.errors['minlength']"></app-invaid-text>
              </div>
            </div>

            <div class="profile-field">
              <label class="font-medium text-black text-[14px]" for="first_name">Familiya</label>
              <div class="relative w-full flex items-center password-input profile-input">
                <input pInputText [ngClass]="{
                    'ng-invalid ng-dirty': ruleForm.controls.first_name.touched && ruleForm.controls.first_name.errors && ruleForm.controls.first_name.errors['required'],
                  }" type="text" id="first_name" placeholder="Familiyangiz" formControlName="first_name" />
              </div>

              <div
                *ngIf="ruleForm.controls.first_name.invalid && (ruleForm.controls.first_name.dirty || ruleForm.controls.first_name.touched)">
                <app-invaid-text [text]="'Familiya kiritilishi shart.'"
                  *ngIf="ruleForm.controls.first_name.errors && ruleForm.controls.first_name.errors['required']"></app-invaid-text>
                <app-invaid-text [text]="'Familiya kamida 4 ta belgidan iborat bo‘lishi kerak.'"
                  *ngIf="ruleForm.controls.first_name.errors && ruleForm.controls.first_name.errors['minlength']"></app-invaid-text>
              </div>
            </div>

            <div class="profile-field profile-field--full">
              <label class="font-medium text-black text-[14px]" for="last_name">Otasining ismi</label>
              <div class="relative w-full flex items-center password-input profile-input">
                <input pInputText [ngClass]="{
                    'ng-invalid ng-dirty': ruleForm.controls.last_name.touched && ruleForm.controls.last_name.invalid,
                  }" type="text" id="last_name" placeholder="Otasining ismi (ixtiyoriy)" formControlName="last_name" />
              </div>

              <div
                *ngIf="ruleForm.controls.last_name.invalid && (ruleForm.controls.last_name.dirty || ruleForm.controls.last_name.touched)">
                <app-invaid-text [text]="'Otasining ismi kamida 4 ta belgidan iborat bo‘lishi kerak.'"
                  *ngIf="ruleForm.controls.last_name.errors && ruleForm.controls.last_name.errors['minlength']"></app-invaid-text>
              </div>
            </div>
          </div>
        </div>

        <div class="profile-form-section">
          <div class="profile-section-title">
            <i class="pi pi-envelope"></i>
            <h5>Aloqa</h5>
          </div>
          <div class="profile-form-grid">
            <div class="profile-field profile-field--full">
              <label class="font-medium text-black text-[14px]" for="email">Elektron pochta</label>
              <div class="relative w-full flex items-center password-input profile-input">
                <input pInputText [ngClass]="{
                    'ng-invalid ng-dirty': ruleForm.controls.email.touched && ruleForm.controls.email.errors && ruleForm.controls.email.errors['required'],
                  }" type="text" id="email" placeholder="example@mail.ru" formControlName="email" />
              </div>

              <div
                *ngIf="ruleForm.controls.email.invalid && (ruleForm.controls.email.dirty || ruleForm.controls.email.touched)">
                <app-invaid-text [text]="'Elektron pochta kiritilishi shart.'"
                  *ngIf="ruleForm.controls.email.errors && ruleForm.controls.email.errors['required']"></app-invaid-text>
                <app-invaid-text [text]="'To‘g‘ri elektron pochta manzilini kiriting.'"
                  *ngIf="ruleForm.controls.email.errors && ruleForm.controls.email.errors['email']"></app-invaid-text>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="profile-form-actions flex md:w-full md:flex-col gap-3">
        <p-button [loading]="loading" (click)="onSubmit()" class="px-0 py-0 rounded-[12px]"
          styleClass="btn w-[170px] md:w-full h-12 md:h-11 rounded-[12px] bg-[var(--green)] text-white flex items-center font-semibold justify-center">Saqlash</p-button>
        <button (click)="cancelEdit()"
          class="btn px-[22px] md:h-11 md:w-full md:justify-center font-semibold cursor-pointer bg-transparent whitespace-nowrap py-[10px] rounded-[12px] text-black border border-solid border-[--grey-300] text-[16px] font-500 flex items-center gap-[10px]">Bekor qilish</button>
      </div>
    </div>
  </div>
</div>
