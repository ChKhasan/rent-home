<div class="announcements">
  <header class="announcements-header">
    <div>
      <p>Shaxsiy kabinet</p>
      <h1 *ngIf="!embedded">Mening e'lonlarim</h1>
      <h2 *ngIf="embedded">Mening e'lonlarim</h2>
    </div>
    <a routerLink="/profile/create"><i class="pi pi-plus" aria-hidden="true"></i>E'lon joylash</a>
  </header>
  <div class="body mx-auto max-w-[1200px] grid grid-cols-3 gap-[10px] md:grid-cols-1 md:gap-3" *ngIf="loading">
    <p-skeleton *ngFor="let item of skeletonList" class="w-full" styleClass="ng_skeleton"></p-skeleton>
  </div>
  <div class="body mx-auto max-w-[1200px] grid grid-cols-3 gap-[10px] md:grid-cols-1 md:gap-3" *ngIf="announcements?.length">
    <span class="w-full" *ngFor="let announcement of announcements">
      <app-announcements-card [announcement]="announcement" [edit]="true"></app-announcements-card>
    </span>
  </div>
  <div class="mx-auto max-w-[1200px] flex justify-center mt-6" *ngIf="totalPage > 0">
    <app-pagination [getData]="__GET_ANNOUNMENTS" [totalPage]="totalPage"></app-pagination>
  </div>
  <div class="empty-state" *ngIf="!loading && !announcements?.length">
    <i class="pi pi-home" aria-hidden="true"></i>
    <h3>Hozircha e'lon yo'q</h3>
    <p>Birinchi e'loningizni joylashtirib boshqaruvni boshlang.</p>
    <a routerLink="/profile/create">E'lon joylash</a>
  </div>
</div>
