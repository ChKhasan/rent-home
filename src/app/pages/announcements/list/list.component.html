<div class="applications">
  <div class="page-width">
    <header class="list-header">
      <div>
        <h1 class="page-title">E’lonlar</h1>
        <p class="result-copy" role="status" *ngIf="!loading && !loadError">
          {{ totalPage }} ta natija<span *ngIf="activeFilterCount"> · {{ activeFilterCount }} ta faol filtr</span>
        </p>
      </div>
      <div class="list-header__actions">
        <app-deal-type-switcher></app-deal-type-switcher>
        <a class="results-tool list-header__map" routerLink="/map" [queryParams]="mapQueryParams">
          <svg lucideMap [size]="18" aria-hidden="true"></svg>
          <span>Xaritada ko‘rish</span>
        </a>
      </div>
    </header>

    <div class="applications-container">
      <aside class="filter-rail" aria-label="E’lon filtrlari">
        <app-filter ngSkipHydration [filterAction]="filterSend" [loading]="loading" [clearFilterAction]="clearFilter"></app-filter>
      </aside>

      <section class="results" aria-label="Qidiruv natijalari" [attr.aria-busy]="loading">
        <div class="results-toolbar" role="group" aria-label="Natijalarni boshqarish">
          <button type="button" class="results-tool results-tool--mobile" (click)="openBottomSheet()">
            <svg lucideSlidersHorizontal [size]="17" aria-hidden="true"></svg>
            <span>Filtrlar</span>
            <span *ngIf="activeFilterCount" class="results-tool__count">{{ activeFilterCount }}</span>
          </button>
          <div class="results-sort">
            <svg lucideArrowUpDown [size]="17" aria-hidden="true"></svg>
            <label class="sr-only" for="listing-sort">E’lonlarni saralash</label>
            <select id="listing-sort" (change)="selectSort($event)">
              <option value="" [selected]="!currentSort">Saralash</option>
              <option *ngFor="let option of sortOptions" [value]="option.value" [selected]="currentSort === option.value">
                {{ option.label }}
              </option>
            </select>
          </div>
          <a class="results-tool results-tool--mobile" routerLink="/map" [queryParams]="mapQueryParams">
            <svg lucideMap [size]="17" aria-hidden="true"></svg>
            <span>Xarita</span>
          </a>
        </div>

        <div *ngIf="activePublisherChips.length || verifiedOnlyActive || commissionFreeActive"
          class="active-filter-chips" role="group" aria-label="E’lon beruvchi bo‘yicha faol filtrlar">
          <button *ngFor="let chip of activePublisherChips" type="button" (click)="removePublisherType(chip.type)"
            class="active-filter-chip" [attr.aria-label]="chip.label + ' filtrini olib tashlash'">
            {{ chip.label }} <svg lucideX [size]="15" aria-hidden="true"></svg>
          </button>
          <button *ngIf="verifiedOnlyActive" type="button" (click)="removePublisherFlag('verified_only')"
            class="active-filter-chip" aria-label="Tekshirilganlar filtrini olib tashlash">
            Tekshirilgan <svg lucideX [size]="15" aria-hidden="true"></svg>
          </button>
          <button *ngIf="commissionFreeActive" type="button" (click)="removePublisherFlag('commission_free')"
            class="active-filter-chip" aria-label="Komissiyasiz filtrini olib tashlash">
            Komissiyasiz <svg lucideX [size]="15" aria-hidden="true"></svg>
          </button>
        </div>

        <div class="results-grid" *ngIf="loading; else completed" aria-label="E’lonlar yuklanmoqda">
          <app-listing-card-skeleton *ngFor="let item of skeletonList"></app-listing-card-skeleton>
        </div>
        <ng-template #completed>
          <div *ngIf="!loadError && announcements.length; else resultsState" class="results-grid">
            <app-announcements-card *ngFor="let announcement of announcements; trackBy: trackByAnnouncementId"
              [announcement]="announcement"></app-announcements-card>
          </div>
          <ng-template #resultsState>
            <div class="results-state" role="status">
              <div class="results-state__icon"><svg lucideSearchX [size]="26" aria-hidden="true"></svg></div>
              <h2>{{ loadError ? 'E’lonlar yuklanmadi' : (activeFilterCount ? 'Mos e’lon topilmadi' : 'Hozircha e’lonlar yo‘q') }}</h2>
              <p *ngIf="!loadError && activeFilterCount">Ko‘proq natija uchun filtrlarni o‘zgartiring.</p>
              <button *ngIf="loadError" type="button" class="results-tool" (click)="__GET_ANNOUNCEMENTS()">Qayta urinish</button>
              <button *ngIf="!loadError && activeFilterCount" type="button" class="results-tool" (click)="clearFilter()">Filtrlarni tozalash</button>
            </div>
          </ng-template>
        </ng-template>

        <div *ngIf="!loadError && hasMorePages" class="results-pagination">
          <app-pagination [getData]="__GET_ANNOUNCEMENTS" [totalPage]="totalPage"></app-pagination>
        </div>
      </section>
    </div>
  </div>
</div>
<app-bottom-sheet title="E’lon filtrlari" closeLabel="Filtrlarni yopish">
  <app-filter ngSkipHydration idPrefix="mobile-listing-filter" [close]="closeBottomSheet" [filterAction]="filterSend" [loading]="loading"
    [clearFilterAction]="clearFilter"></app-filter>
</app-bottom-sheet>
