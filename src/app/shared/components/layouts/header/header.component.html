<div class="header">
  <app-register-dialog [completeCallback]="completeRegisterCallback"></app-register-dialog>
  <app-auth-dialog [url]="authRedirect" [openRegister]="openRegister"></app-auth-dialog>
  <app-number-dialog [completeCallback]="completeCallback" [url]="'profile'"></app-number-dialog>
  <app-sms-dialog [completeCallback]="completeSmsCallback" [anotherPhoneNumber]="anotherPhoneNumber"></app-sms-dialog>
  <p-toast
    key="global"
    position="bottom-right"
    styleClass="global-toast"
    [baseZIndex]="5000"
    [breakpoints]="{ '920px': { width: 'calc(100vw - 32px)', right: '16px', left: '16px' } }">
  </p-toast>

  <div class="header__inner">
    <a routerLink="/" class="brand" aria-label="Nexthome bosh sahifa">
      <img class="brand__logo" src="assets/images/brand-wordmark.png" alt="" width="900" height="173" />
    </a>

    <nav class="header__nav" aria-label="Asosiy navigatsiya">
      <a routerLink="/announcements" routerLinkActive="is-active">E'lonlar</a>
      <a routerLink="/map" routerLinkActive="is-active">Xarita</a>
    </nav>

    <div class="header__actions">
      <div class="theme-picker">
        <button
          type="button"
          class="icon-button"
          title="Ko‘rinish rejimi"
          aria-label="Ko‘rinish rejimini tanlash"
          [attr.aria-expanded]="themeMenuOpen"
          (click)="themeMenuOpen = !themeMenuOpen">
          <i class="pi" [class.pi-desktop]="theme.preference() === 'system'" [class.pi-sun]="theme.preference() === 'light'" [class.pi-moon]="theme.preference() === 'dark'"></i>
        </button>
        <div *ngIf="themeMenuOpen" class="theme-picker__menu" role="menu" aria-label="Ko‘rinish rejimi">
          <button type="button" role="menuitemradio" [attr.aria-checked]="theme.preference() === 'system'" (click)="setTheme('system')">
            <i class="pi pi-desktop"></i><span>Tizim</span><i *ngIf="theme.preference() === 'system'" class="pi pi-check"></i>
          </button>
          <button type="button" role="menuitemradio" [attr.aria-checked]="theme.preference() === 'light'" (click)="setTheme('light')">
            <i class="pi pi-sun"></i><span>Yorug‘</span><i *ngIf="theme.preference() === 'light'" class="pi pi-check"></i>
          </button>
          <button type="button" role="menuitemradio" [attr.aria-checked]="theme.preference() === 'dark'" (click)="setTheme('dark')">
            <i class="pi pi-moon"></i><span>Qorong‘i</span><i *ngIf="theme.preference() === 'dark'" class="pi pi-check"></i>
          </button>
        </div>
      </div>

      <a *ngIf="authService.auth" routerLink="/likes" class="icon-button desktop-action" title="Saqlanganlar" aria-label="Saqlangan e'lonlar">
        <i class="pi pi-heart"></i>
      </a>
      <a *ngIf="authService.auth" routerLink="/profile/chat" class="icon-button desktop-action" title="Chat" aria-label="Chat">
        <i class="pi pi-comments"></i>
      </a>
      <button type="button" class="primary-action desktop-action" (click)="createAnnouncement()">
        <i class="pi pi-plus"></i><span>E'lon berish</span>
      </button>
      <button type="button" class="profile-button" (click)="openProfile()" [attr.aria-label]="authService.auth ? 'Profilni ochish' : 'Kirish'">
        <img *ngIf="authService.user?.images?.[0]?.image; else profileIcon" [src]="authService.user?.images?.[0]?.image" alt="" />
        <ng-template #profileIcon><i class="pi pi-user"></i></ng-template>
        <span class="profile-button__label">{{ authService.auth ? (authService.user?.name || 'Profil') : 'Kirish' }}</span>
      </button>
      <button type="button" class="icon-button menu-button" aria-label="Menyuni ochish" [attr.aria-expanded]="mobileMenuOpen" (click)="mobileMenuOpen = !mobileMenuOpen">
        <i class="pi" [class.pi-bars]="!mobileMenuOpen" [class.pi-times]="mobileMenuOpen"></i>
      </button>
    </div>
  </div>

  <nav *ngIf="mobileMenuOpen" class="mobile-menu" aria-label="Mobil navigatsiya">
    <a routerLink="/announcements" (click)="mobileMenuOpen = false"><i class="pi pi-list"></i>E'lonlar</a>
    <a routerLink="/map" (click)="mobileMenuOpen = false"><i class="pi pi-map"></i>Xarita</a>
    <a *ngIf="authService.auth" routerLink="/likes" (click)="mobileMenuOpen = false"><i class="pi pi-heart"></i>Saqlanganlar</a>
    <a *ngIf="authService.auth" routerLink="/profile/chat" (click)="mobileMenuOpen = false"><i class="pi pi-comments"></i>Chat</a>
    <button type="button" class="primary-action" (click)="createAnnouncement(); mobileMenuOpen = false"><i class="pi pi-plus"></i>E'lon berish</button>
  </nav>
</div>
