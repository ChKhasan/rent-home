@if (linksReady) {
  <div class="profile-tab">
    <div class="tab">
      @for (link of linkOptions; track link) {
        <button [routerLink]="link.to" [routerLinkActiveOptions]="{ exact: link.to === '/profile' }" routerLinkActive="active">
          {{ link.title }}
        </button>
      }
    </div>
  </div>
}
