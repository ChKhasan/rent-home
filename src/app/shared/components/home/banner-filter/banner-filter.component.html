<form class="quick-search" aria-label="Uy qidirish" (ngSubmit)="search()">
  <div class="quick-search__controls">
    <fieldset class="quick-search__group quick-search__group--deal">
      <legend>E'lon turi</legend>
      <div class="quick-search__segments">
        <button
          *ngFor="let option of dealTypeOptions"
          type="button"
          [class.quick-search__segment--active]="filter.deal_type === option.value"
          [attr.aria-pressed]="filter.deal_type === option.value"
          (click)="selectDealType(option.value)"
        >
          {{ option.label }}
        </button>
      </div>
    </fieldset>

    <fieldset class="quick-search__group quick-search__group--occupancy quick-search__advanced">
      <legend>Ijara turi</legend>
      <div class="quick-search__segments">
        <button
          *ngFor="let option of occupancyOptions"
          type="button"
          [class.quick-search__segment--active]="filter.partnership === option.value"
          [attr.aria-pressed]="filter.partnership === option.value"
          (click)="selectOccupancy(option.value)"
        >
          {{ option.label }}
        </button>
      </div>
    </fieldset>

    <div class="quick-search__group quick-search__group--region">
      <label for="hero-region">Viloyat</label>
      <p-select
        inputId="hero-region"
        name="hero-region"
        [options]="dictionaryService.regions"
        [(ngModel)]="filter.region"
        optionLabel="name"
        optionValue="id"
        placeholder="Hududni tanlang"
        [filter]="true"
        filterPlaceholder="Viloyatni qidiring"
        [showClear]="true"
        [appendTo]="'body'"
        (onChange)="onRegionChange($event.value)"
      />
    </div>

    <div class="quick-search__group quick-search__group--district quick-search__advanced">
      <label for="hero-district">Tuman</label>
      <p-select
        inputId="hero-district"
        name="hero-district"
        [disabled]="!filter.region"
        [options]="dictionaryService.districts"
        [(ngModel)]="filter.district"
        optionLabel="name"
        optionValue="id"
        placeholder="Tumanni tanlang"
        [filter]="true"
        filterPlaceholder="Tumanni qidiring"
        [showClear]="true"
        [appendTo]="'body'"
      />
    </div>

    <label class="quick-search__group quick-search__group--rooms quick-search__advanced">
      <span>Xonalar</span>
      <input
        name="hero-room-count"
        [(ngModel)]="filter.room_count"
        inputmode="numeric"
        type="number"
        min="1"
        max="20"
        placeholder="1+"
      />
    </label>

    <label class="quick-search__group quick-search__group--price quick-search__advanced">
      <span>Maksimal narx</span>
      <span class="quick-search__price-control">
        <input
          name="hero-max-price"
          [(ngModel)]="filter.total_price__lte"
          inputmode="numeric"
          type="number"
          min="0"
          placeholder="Masalan, 500"
        />
        <select name="hero-currency" [(ngModel)]="filter.currency" aria-label="Pul birligi">
          <option *ngFor="let currency of currencyOptions" [value]="currency.value">
            {{ currency.value }}
          </option>
        </select>
      </span>
    </label>

    <div class="quick-search__actions">
      <button type="submit" class="quick-search__submit">
        <svg lucideSearch [size]="20" aria-hidden="true"></svg>
        <span>Qidirish</span>
      </button>
      <button type="button" class="quick-search__mobile-filter" (click)="openAdvancedFilters()">
        <svg lucideSlidersHorizontal [size]="20" aria-hidden="true"></svg>
        <span>Filtrlar<span *ngIf="advancedFilterCount"> ({{ advancedFilterCount }})</span></span>
      </button>
    </div>
  </div>
</form>

<app-bottom-sheet #advancedSheet title="Batafsil filtrlar" closeLabel="Batafsil filtrlarni yopish">
  <div class="quick-search-sheet">
    <div class="quick-search-sheet__body">
      <fieldset class="quick-search-sheet__section">
        <legend>Ijara turi</legend>
        <div class="quick-search__segments quick-search__segments--sheet">
          <button
            *ngFor="let option of occupancyOptions"
            type="button"
            [class.quick-search__segment--active]="filter.partnership === option.value"
            [attr.aria-pressed]="filter.partnership === option.value"
            (click)="selectOccupancy(option.value)"
          >
            {{ option.label }}
          </button>
        </div>
      </fieldset>

      <div class="quick-search-sheet__section">
        <label for="mobile-district">Tuman</label>
        <p-select
          inputId="mobile-district"
          [disabled]="!filter.region"
          [options]="dictionaryService.districts"
          [(ngModel)]="filter.district"
          optionLabel="name"
          optionValue="id"
          placeholder="Tumanni tanlang"
          [filter]="true"
          filterPlaceholder="Tumanni qidiring"
          [showClear]="true"
          [appendTo]="'body'"
        />
      </div>

      <label class="quick-search-sheet__section">
        <span>Xonalar soni</span>
        <input [(ngModel)]="filter.room_count" inputmode="numeric" type="number" min="1" max="20" placeholder="1+" />
      </label>

      <div class="quick-search-sheet__section">
        <label for="mobile-max-price">Maksimal narx</label>
        <div class="quick-search__price-control quick-search__price-control--sheet">
          <input
            id="mobile-max-price"
            [(ngModel)]="filter.total_price__lte"
            inputmode="numeric"
            type="number"
            min="0"
            placeholder="Masalan, 500"
          />
          <select [(ngModel)]="filter.currency" aria-label="Pul birligi">
            <option *ngFor="let currency of currencyOptions" [value]="currency.value">
              {{ currency.value }}
            </option>
          </select>
        </div>
      </div>
    </div>

    <footer class="quick-search-sheet__footer">
      <button type="button" class="quick-search-sheet__clear" (click)="clearAdvancedFilters()">Tozalash</button>
      <button type="button" class="quick-search-sheet__apply" (click)="applyAdvancedFilters()">Tanlovni saqlash</button>
    </footer>
  </div>
</app-bottom-sheet>
